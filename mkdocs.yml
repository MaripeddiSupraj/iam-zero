site_name: iam-zero
site_description: Detect overpermissive IAM roles on AWS and GCP. Auto-generate least-privilege policies.
site_url: https://supraj.dev/tools/iam-zero
repo_url: https://github.com/MaripeddiSupraj/iam-zero
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: red
    accent: red
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.tabs.link

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - How it Works: how-it-works.md
  - CLI Reference:
    - Commands: cli/commands.md
    - Output Modes: cli/output-modes.md
  - Providers:
    - AWS: providers/aws.md
    - GCP: providers/gcp.md
  - Guides:
    - Installation: guides/installation.md
    - Configuration: guides/configuration.md
    - GitHub PR Setup: guides/github-pr-setup.md
  - Security & Safety: security.md
  - Development: development.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - toc:
      permalink: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/MaripeddiSupraj/iam-zero
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/zero-iam/

copyright: Copyright &copy; 2025 Supraj Maripeddi
